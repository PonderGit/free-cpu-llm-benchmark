name: JPC D4 DeepSeek Measurement Redesign

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_d4_deepseek_redesign.py"
      - ".github/workflows/d4-deepseek-redesign.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jpc-d4-deepseek-redesign
  cancel-in-progress: true

jobs:
  bounded-redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas huggingface_hub
          sudo apt-get update -y
          sudo apt-get install -y curl

      - name: Record runner resources
        run: |
          mkdir -p results
          {
            echo "cpu_count=$(nproc)"
            echo "memory:"
            free -h
            echo "disk:"
            df -h .
          } > results/runner_resources.txt

      - name: Download pinned llama.cpp CPU binaries
        run: |
          curl -L --fail --retry 3             -o llama.tar.gz             https://github.com/ggml-org/llama.cpp/releases/download/b11146/llama-b11146-bin-ubuntu-x64.tar.gz
          mkdir -p llama
          tar -xzf llama.tar.gz -C llama
          find llama -type f -name "llama-*" -exec chmod +x {} ;
          SERVER="$(find llama -type f -name llama-server | head -n 1)"
          if [ -z "$SERVER" ]; then
            echo "llama-server not found" >&2
            exit 1
          fi
          echo "LLAMA_SERVER_BIN=$SERVER" >> "$GITHUB_ENV"

      - name: Download pinned DeepSeek model
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          repo="TheBloke/deepseek-llm-7B-chat-GGUF"
          rev="d8fbf4a7e8038f7f3cf66014a4d6ea9ea8febd1f"
          fn="deepseek-llm-7b-chat.Q4_K_M.gguf"
          p=hf_hub_download(repo_id=repo,filename=fn,revision=rev)
          Path("model_path.txt").write_text(p,encoding="utf-8")
          print(p)
          PY

      - name: Start local CPU inference server
        shell: bash
        run: |
          set -euo pipefail
          MODEL_PATH="$(cat model_path.txt)"
          mkdir -p results
          nohup "$LLAMA_SERVER_BIN"             -m "$MODEL_PATH"             --host 127.0.0.1             --port 8080             -t "$(nproc)"             -c 4096             > results/d4_server.log 2>&1 &
          echo $! > results/d4_server.pid

          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Server failed to become healthy" >&2
            tail -n 150 results/d4_server.log || true
            exit 1
          fi

      - name: Run bounded redesign pilot
        env:
          LLAMA_SERVER_URL: http://127.0.0.1:8080
        run: |
          python scripts/run_d4_deepseek_redesign.py | tee results/d4_console.txt

      - name: Record execution manifest
        if: always()
        run: |
          {
            echo "workflow=JPC D4 DeepSeek Measurement Redesign"
            echo "single_main_model_family=DeepSeek"
            echo "provisional_model=deepseek-ai/deepseek-llm-7b-chat"
            echo "quantization=Q4_K_M"
            echo "sample_expansion=false"
            echo "existing_pair_count=8"
            echo "gpu_used=false"
            echo "paid_api_used=false"
            echo "paid_compute_used=false"
            echo "final_model_frozen=false"
            echo "final_protocols_frozen=false"
            echo "completed_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > results/d4_execution_manifest.txt

      - name: Upload D4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpc-d4-deepseek-redesign-results
          path: results/
          if-no-files-found: warn
          retention-days: 7
