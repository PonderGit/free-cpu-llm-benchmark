name: Free CPU LLM Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-cpu-llm-benchmark
  cancel-in-progress: true

jobs:
  cpu-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub
          sudo apt-get update -y
          sudo apt-get install -y curl

      - name: Resolve and download public GGUF model
        run: |
          python scripts/prepare_model.py

      - name: Download pinned llama.cpp CPU binaries
        run: |
          curl -L --fail --retry 3 \
            -o llama.tar.gz \
            https://github.com/ggml-org/llama.cpp/releases/download/b11146/llama-b11146-bin-ubuntu-x64.tar.gz
          mkdir -p llama
          tar -xzf llama.tar.gz -C llama
          find llama -type f -name "llama-*" -exec chmod +x {} \;

      - name: Record environment
        run: |
          mkdir -p results
          {
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_os=$RUNNER_OS"
            echo "arch=$(uname -m)"
            echo "nproc=$(nproc)"
            echo "--- lscpu ---"
            lscpu
            echo "--- memory ---"
            free -h
            echo "--- model ---"
            cat model_manifest.txt
          } > results/environment.txt

      - name: Run CPU throughput benchmark
        shell: bash
        run: |
          set -euo pipefail
          MODEL_PATH="$(cat model_path.txt)"
          BENCH="$(find llama -type f -name llama-bench | head -n 1)"
          if [ -z "$BENCH" ]; then
            echo "llama-bench not found" >&2
            exit 1
          fi
          THREADS="$(nproc)"
          "$BENCH" \
            -m "$MODEL_PATH" \
            -p 256,1024 \
            -n 16 \
            -r 2 \
            -t "$THREADS" \
            -o json \
            > results/llama_bench.json \
            2> results/llama_bench.stderr

      - name: Write completion marker
        if: always()
        run: |
          {
            echo "workflow=Free CPU LLM Benchmark"
            echo "benchmark_scope=throughput_only"
            echo "cost_target=zero-paid-services"
            echo "gpu_used=false"
            echo "paid_api_used=false"
            echo "completed_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > results/run_manifest.txt

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-cpu-llm-benchmark-results
          path: results/
          if-no-files-found: warn
          retention-days: 7
