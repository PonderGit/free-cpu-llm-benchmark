name: Free CPU LLM Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub
          sudo apt-get update -y
          sudo apt-get install -y curl time

      - name: Resolve and download public GGUF model
        run: |
          python scripts/prepare_model.py

      - name: Download pinned llama.cpp CPU binaries
        run: |
          curl -L --fail --retry 3 \
            -o llama.tar.gz \
            https://github.com/ggml-org/llama.cpp/releases/download/b11146/llama-b11146-bin-ubuntu-x64.tar.gz
          mkdir -p llama
          tar -xzf llama.tar.gz -C llama
          find llama -type f -name "llama-*" -exec chmod +x {} \;

      - name: Record environment
        run: |
          mkdir -p results
          {
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_os=$RUNNER_OS"
            echo "arch=$(uname -m)"
            echo "nproc=$(nproc)"
            echo "--- lscpu ---"
            lscpu
            echo "--- memory ---"
            free -h
            echo "--- model ---"
            cat model_manifest.txt
          } > results/environment.txt

      - name: Run throughput benchmark
        shell: bash
        run: |
          set -euo pipefail
          MODEL_PATH="$(cat model_path.txt)"
          BENCH="$(find llama -type f -name llama-bench | head -n 1)"
          if [ -z "$BENCH" ]; then
            echo "llama-bench not found" >&2
            exit 1
          fi
          THREADS="$(nproc)"
          "$BENCH" \
            -m "$MODEL_PATH" \
            -p 256,1024 \
            -n 16 \
            -r 2 \
            -t "$THREADS" \
            -o json \
            > results/llama_bench.json \
            2> results/llama_bench.stderr

      - name: Run generic A/B smoke tests
        shell: bash
        run: |
          set -euo pipefail
          MODEL_PATH="$(cat model_path.txt)"
          CLI="$(find llama -type f -name llama-cli | head -n 1)"
          if [ -z "$CLI" ]; then
            echo "llama-cli not found" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          short = """Compare two candidate answers to the same user request.
          User request: Explain why leaves look green.
          Answer A: Leaves appear green because chlorophyll absorbs much of the red and blue light and reflects more green light.
          Answer B: Leaves are green because plants contain green water that shines through the surface.
          Return only A or B for the better answer."""

          base = """A user asks for a concise explanation of a technical concept. Candidate A is accurate, directly addresses the question, distinguishes assumptions from facts, and avoids unsupported claims. Candidate B is fluent but includes several unsupported details and does not clearly answer the main question. """
          medium = "Compare two candidate answers and return only A or B for the better answer.\n" + (base * 18)

          Path("short_prompt.txt").write_text(short, encoding="utf-8")
          Path("medium_prompt.txt").write_text(medium, encoding="utf-8")
          PY

          THREADS="$(nproc)"

          /usr/bin/time -f "elapsed_sec=%e\nmax_rss_kb=%M" \
            -o results/smoke_short.time \
            "$CLI" -m "$MODEL_PATH" -f short_prompt.txt -n 8 -t "$THREADS" --temp 0 \
            > results/smoke_short.txt \
            2> results/smoke_short.stderr

          /usr/bin/time -f "elapsed_sec=%e\nmax_rss_kb=%M" \
            -o results/smoke_medium.time \
            "$CLI" -m "$MODEL_PATH" -f medium_prompt.txt -n 8 -t "$THREADS" --temp 0 \
            > results/smoke_medium.txt \
            2> results/smoke_medium.stderr

      - name: Write completion marker
        if: always()
        run: |
          {
            echo "workflow=Free CPU LLM Benchmark"
            echo "cost_target=zero-paid-services"
            echo "gpu_used=false"
            echo "paid_api_used=false"
            echo "completed_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > results/run_manifest.txt

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-cpu-llm-benchmark-results
          path: results/
          if-no-files-found: warn
          retention-days: 7
